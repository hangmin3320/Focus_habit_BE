version: '3.8'

services:
  app:
    build: ./app
    container_name: focus-habit-app
    restart: always
    ports:
      - "8000:8000"

  nginx:
    image: nginx:latest
    container_name: focus-habit-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data_collection.html:/usr/share/nginx/html/data_collection.html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: focus-habit-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot