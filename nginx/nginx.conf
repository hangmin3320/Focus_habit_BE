events {}

http {
    server {
        listen 80;
        server_name focushabit.site;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name focushabit.site;

        ssl_certificate /etc/letsencrypt/live/focushabit.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/focushabit.site/privkey.pem;

        location /data-collection {
            root /usr/share/nginx/html;
            try_files /data_collection.html =404;
        }

        # WebSocket 엔드포인트에 대한 명시적 설정
        location /ws/analysis {
            proxy_pass http://app:8000;
            proxy_http_version 1.1; # WebSocket에 필수
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade"; # "upgrade"로 고정
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 그 외 모든 요청에 대한 일반 설정
        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}